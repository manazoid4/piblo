name: Android companion

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + unit tests
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.PIBLO_ANDROID_KEYSTORE_B64 }}
          PIBLO_KEYSTORE_PASSWORD: ${{ secrets.PIBLO_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/piblo.p12"
            export PIBLO_KEYSTORE="$RUNNER_TEMP/piblo.p12"
          fi
          bash ./gradlew assembleDebug testDebugUnitTest

      - name: Print APK signer
        run: |
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - name: Build info for one-tap phone updates (scripts/stage_phone_apk.py)
        run: |
          echo "{\"version_code\": $((100 + GITHUB_RUN_NUMBER)), \"version_name\": \"0.2.0-beta+ci$GITHUB_RUN_NUMBER\", \"sha\": \"$GITHUB_SHA\"}" > android/app/build/outputs/apk/debug/piblo-build.json

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: piblo-companion-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/piblo-build.json
          if-no-files-found: error
