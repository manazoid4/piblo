name: Piblo CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nod-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: nod-${{ runner.os }}-${{ hashFiles('platformio.ini', 'host/requirements.txt') }}
          restore-keys: nod-${{ runner.os }}-

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install platformio pytest pytest-xdist playwright -r host/requirements.txt
          pip install "click>=8.0.4,<8.4"
          pip install -r host/requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Core tests
        run: python -m pytest host/tests -q -n auto

      - name: MCP server tests (TypeScript)
        run: |
          cd host/mcp
          npm ci
          npm test

      - name: Firmware logic tests (state machine, layout, theme)
        run: make -C firmware/nod test

      - name: Build firmware
        run: pio run -e cardputer-adv

      - name: Size gate
        run: |
          size=$(stat -c %s .pio/build/cardputer-adv/firmware.bin)
          limit=1507328  # app slot 0x170000 (device partition table)
          echo "firmware.bin: $size bytes of $limit ($((size * 100 / limit))%)"
          echo "### Firmware size" >> "$GITHUB_STEP_SUMMARY"
          echo "\`firmware.bin\` = **$size** bytes of $limit ($((size * 100 / limit))%), headroom $((limit - size))" >> "$GITHUB_STEP_SUMMARY"
          headroom=$((limit - size))
          echo "headroom: $headroom bytes"
          if [ "$size" -gt "$limit" ]; then echo "::error::firmware.bin exceeds app slot by $((size - limit)) bytes"; exit 1; fi
          if [ "$headroom" -lt 16384 ]; then echo "::error::firmware.bin headroom only $headroom bytes (< 16384) of the app slot"; exit 1; fi

      - name: Size report vs baseline (headroom floor 32 KB)
        run: |
          set -o pipefail
          rc=0
          python scripts/fw-size-report.py --baseline docs/perf/fw-baseline.json --min-headroom 32768 | tee size-report.txt || rc=$?
          { echo '```'; cat size-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Manifest
        run: python scripts/fw_manifest.py .pio/build/cardputer-adv/firmware.bin dist/

      - name: Stage artifact
        run: |
          mkdir -p out
          cp dist/latest.bin out/nod-fw.bin
          cp dist/manifest.json out/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: nod-fw-${{ github.event.pull_request.head.sha || github.sha }}
          path: out/
          if-no-files-found: error
